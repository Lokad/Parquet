name: ci

# Public Release qualification on both supported operating systems. Timing
# campaigns stay on controlled hosts; this workflow asserts correctness,
# packaging, and distributable contents only, never performance parity.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    name: qualify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore and build Release
        id: compile
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP "lokad-parquet-nuget"
          "package-directory=$packageDirectory" >> $env:GITHUB_OUTPUT
          dotnet restore Lokad.Parquet.slnx --locked-mode --tl:off -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Lokad.Parquet.slnx -c Release --tl:off --nologo -v minimal --no-restore "-p:PackageOutputPath=$packageDirectory"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release test, vector lane
        shell: pwsh
        run: |
          ./test.ps1 -Configuration Release -SkipBuild | Tee-Object -FilePath test-vector.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release test, forced-scalar lane
        shell: pwsh
        run: |
          ./test.ps1 -Configuration Release -ForceScalar -SkipBuild | Tee-Object -FilePath test-scalar.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Format check
        shell: pwsh
        run: dotnet format Lokad.Parquet.slnx --verify-no-changes --no-restore

      - name: Benchmark truth verification
        if: runner.os == 'Linux'
        shell: pwsh
        run: dotnet run --project bench/Lokad.Parquet.Benchmarks/Lokad.Parquet.Benchmarks.csproj --configuration Release --framework net10.0 --tl:off --no-build --no-launch-profile -- --verify-truth

      - name: Census smoke orchestration
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./bench.ps1 -Suite CensusSmoke -SkipBuild

      - name: Inspect distributable
        shell: pwsh
        env:
          PACKAGE_DIRECTORY: ${{ steps.compile.outputs.package-directory }}
        run: |
          function Read-PackageEntry($entry) {
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $reader.ReadToEnd() }
            finally { $reader.Dispose() }
          }

          $packages = @(Get-ChildItem -LiteralPath $env:PACKAGE_DIRECTORY -Filter "Lokad.Parquet.*.nupkg" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one package from this build." }
          $archive = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $requiredEntries = @("README.md", "CHANGELOG.md", "LICENSE.txt", "icon.png", "Lokad.Parquet.nuspec")
            foreach ($framework in @("net10.0", "net11.0")) {
              $requiredEntries += "lib/$framework/Lokad.Parquet.dll", "lib/$framework/Lokad.Parquet.xml"
            }
            foreach ($required in $requiredEntries) {
              if ($null -eq $archive.GetEntry($required)) { throw "Package is missing $required." }
            }
            [xml]$nuspec = Read-PackageEntry $archive.GetEntry("Lokad.Parquet.nuspec")
            if ($nuspec.SelectNodes("//*[local-name()='dependency']").Count -ne 0) { throw "Package gained a third-party dependency." }
            if ((Read-PackageEntry $archive.GetEntry("README.md")) -match "\]\((SPEC|BENCHMARKS)\.md\)") { throw "Package README has repository-relative links." }
          }
          finally { $archive.Dispose() }

      - name: Publish test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: test-*.log

      - name: Publish package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: ${{ steps.compile.outputs.package-directory }}/*
